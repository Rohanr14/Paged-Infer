name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both SIMD backends get exercised: ubuntu is x86_64 (AVX2+FMA),
        # macos-14 is Apple Silicon (NEON). A kernel that only works on the
        # machine it was written on is caught here.
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --release --all-targets

      - name: Report the SIMD backend actually selected
        run: cargo test --release --test simd_tests test_reports_a_backend -- --nocapture

      - name: Replay fixture workloads and verify full outputs
        run: |
          cargo run --release --bin workload_replay -- --threads 2 --workload workloads/mixed.json --config workloads/configs/baseline.json --config workloads/configs/no-prefix.json --repeats 2 --verify --output mixed-replay.jsonl
          cargo run --release --bin workload_replay -- --threads 2 --workload workloads/pressure.json --config workloads/configs/tight-pool.json --repeats 2 --verify --output pressure-replay.jsonl
          cargo run --release --bin workload_replay -- --threads 2 --workload workloads/cancellation.json --repeats 2 --verify --output cancellation-replay.jsonl

      # Frame padding forces transport pressure without a real-model download.
      # The identical fully-drained stream must also complete, ruling out a
      # serializer that cannot keep up even with a healthy client.
      - name: Stalled-reader socket probe
        run: cargo run --release --bin stalled_reader_probe > stalled-reader.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workload-reports-${{ matrix.os }}
          path: |
            *-replay.jsonl
            stalled-reader.json

  golden-fixture:
    name: golden fixture is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install numpy

      # The committed fixtures are the references the whole test suite
      # trusts, so their generators must still reproduce them. Weights, ids
      # and the tokenizer are byte-exact; the reference logits are compared
      # numerically, because a float32 NumPy matmul rounds differently on
      # different BLAS builds and CPUs (see the generator's docstring).
      - name: Check the golden fixture
        run: python3 scripts/gen_golden_fixture.py --check

      - name: Regenerate the tokenizer fixture and diff
        run: |
          python3 scripts/gen_tokenizer_fixture.py
          git diff --exit-code -- tests/fixtures/

  transformers-reference:
    name: pinned Transformers reference is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-reference.txt

      # The CPU wheel avoids downloading CUDA packages. The ordinary Rust test
      # matrix consumes the small committed fixtures on both architectures;
      # this job checks their independent oracle, without downloading weights.
      - name: Install pinned CPU reference
        run: |
          pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/requirements-reference.txt

      - name: Check oracle comparison safeguards
        run: python3 -m unittest discover -s scripts -p 'test_llama3_reference.py'

      - name: Regenerate and check numerical fixtures
        run: python3 scripts/gen_llama3_reference.py --check

  benchmarks:
    name: benchmarks run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Neither needs model weights, so both are smoke-testable in CI. Timings
      # from a shared runner are noise; this checks they still run and report.
      - name: Kernel microbenchmark
        run: cargo run --release --bin benchmark

      - name: Prefix cache benchmark
        run: cargo run --release --bin prefix_cache_benchmark

      # Small batch/step counts: CI checks it runs and that batching is not a
      # regression, not the wall-clock figures, which are noise on a shared runner.
      - name: Batched decode benchmark
        run: BENCH_LAYERS=2 BENCH_VOCAB=2048 BENCH_STEPS=2 BENCH_BATCHES="1 4" cargo run --release --bin batch_benchmark
